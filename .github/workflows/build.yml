name: Build Resume

on:
  push:
    branches: [main]
    paths:
      - "AW_Res.tex"
      - "altacv.cls"
  pull_request:
    paths:
      - "AW_Res.tex"
      - "altacv.cls"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: AW_Res.tex

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: AW_Res.pdf
          retention-days: 30
