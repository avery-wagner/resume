name: Build Resume

on:
  push:
    branches: [main]
    paths:
      - "AW_Res.tex"
      - "altacv.cls"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: AW_Res.tex

      - name: Commit updated PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build resume PDF"
          file_pattern: AW_Res.pdf
