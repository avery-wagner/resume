name: Build Resume

on:
  push:
    branches: [develop]
    paths:
      - "Avery_Wagner_Resume.tex"
      - "altacv.cls"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Avery_Wagner_Resume.tex

      - name: Publish to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Avery_Wagner_Resume.pdf
          git commit -m "Publish build from GitHub Actions"
          git push origin HEAD:main --force

      - name: Notify portfolio to redeploy
        env:
          DISPATCH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/avery-wagner/portfolio/dispatches \
            -d '{"event_type":"resume-updated"}'
